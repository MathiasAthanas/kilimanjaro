name: kilimanjaro
description: Kilimanjaro Schools mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  pinput: ^5.0.0
  gap: ^3.0.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  flutter_pdfview: ^1.4.4
  video_player: ^2.8.3
  chewie: ^1.8.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  confetti: ^0.7.0
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.3
  open_file: ^3.3.2
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/kilimanjaro_logo_icon.png
  adaptive_icon_background: "#25AAE2"
  adaptive_icon_foreground: assets/images/kilimanjaro_logo_adaptive_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - .env
