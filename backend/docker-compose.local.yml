services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kilimanjaro
      POSTGRES_PASSWORD: kilimanjaro
      POSTGRES_DB: kilimanjaro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kilimanjaro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilimanjaro -d kilimanjaro"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: kilimanjaro
      RABBITMQ_DEFAULT_PASS: kilimanjaro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kilimanjaro-postgres:
