name: Mobile CI

on:
  push:
    paths:
      - 'mobile/kilimanjaro/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/kilimanjaro/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: mobile/kilimanjaro

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      # dotenv requires the env files to exist for the bundle.
      - name: Ensure env file
        run: test -f .env || cp .env.staging .env

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

  release-build-guard:
    # Verifies a release build resolves a valid HTTPS production API URL and
    # compiles. Requires the production env file.
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (production config)
        run: flutter build apk --release --dart-define=ENV=production
