<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .primary-gradient {
            background: linear-gradient(135deg, #006591 0%, #0ea5e9 100%);
        }

        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #006591 !important;
            box-shadow: 0 0 0 2px rgba(0, 101, 145, 0.1);
        }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #bec8d2;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#8d90ff",
                        "surface": "#faf8ff",
                        "secondary-fixed": "#acedff",
                        "primary": "#006591",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#89ceff",
                        "surface-container-highest": "#dae2fd",
                        "surface-bright": "#faf8ff",
                        "on-secondary-container": "#006172",
                        "on-background": "#131b2e",
                        "primary-fixed": "#c9e6ff",
                        "outline-variant": "#bec8d2",
                        "on-primary-container": "#003751",
                        "surface-variant": "#dae2fd",
                        "background": "#faf8ff",
                        "on-primary-fixed": "#001e2f",
                        "on-primary": "#ffffff",
                        "surface-tint": "#006591",
                        "outline": "#6e7881",
                        "on-secondary-fixed": "#001f26",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "inverse-on-surface": "#eef0ff",
                        "error-container": "#ffdad6",
                        "tertiary": "#494bd6",
                        "on-primary-fixed-variant": "#004c6e",
                        "on-secondary": "#ffffff",
                        "primary-container": "#0ea5e9",
                        "surface-container": "#eaedff",
                        "secondary-container": "#57dffe",
                        "error": "#ba1a1a",
                        "surface-dim": "#d2d9f4",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#1407ad",
                        "surface-container-high": "#e2e7ff",
                        "secondary": "#00687a",
                        "inverse-surface": "#283044",
                        "inverse-primary": "#89ceff",
                        "tertiary-fixed": "#e1e0ff",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "on-tertiary-fixed": "#07006c",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "secondary-fixed-dim": "#4cd7f6",
                        "on-surface": "#131b2e",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#3e4850"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "container-padding": "20px",
                        "xs": "8px",
                        "md": "16px",
                        "base": "4px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Space Grotesk"],

                        "headline-lg": ["Space Grotesk"],
                        "label-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "headline-lg": ["30px", {"lineHeight": "36px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding h-16 w-full fixed top-0 z-50 bg-surface shadow-sm border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high p-2 rounded-full transition-colors" onclick="history.back()">arrow_back</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight">Intervention Record</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<div class="w-8 h-8 rounded-full overflow-hidden border-2 border-primary">
<img alt="Teacher profile photo" data-alt="A professional headshot of a female educator in a bright, modern school environment. She has a warm, confident expression. The lighting is soft and natural, emphasizing a high-contrast corporate modern aesthetic with clean lines and a professional atmosphere, reflecting the Kilimanjaro Schools brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6eV0NEywQ0Ps-FP--CVdNTuPwy8itCkP1raH8usB8gOIPcyaRcguJGUM_BtEHqMeXCYAuaYTXlf_hxGMqXnQuQBi1Ln4Xe78NrfY57i7SkBfQ3NDfLrAvyTx892VMzFaekf3SCxWkwhp_XlvIs-c4pvQ0iejqwoJxSEM30-z7SZpc6azmaHVDgQaqwACGn9-l5iz57eKWglg46LdjR03Ark4O7QvXgYvS-0jvoKHhOtxYGZB1F1jQiF4XQwp1RTaD6nzTFhCaZQ"/>
</div>
</div>
</header>
<main class="mt-20 px-container-padding max-w-2xl mx-auto">
<!-- Student Context Card -->
<div class="bg-primary-container/10 p-md rounded-xl border border-primary-container/30 mb-lg flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shadow-sm">
<span class="material-symbols-outlined">person</span>
</div>
<div>
<p class="font-label-md text-on-surface-variant uppercase tracking-wider">Student Profile</p>
<h2 class="font-headline-sm text-headline-sm text-on-background">Amina Juma</h2>
<p class="font-body-sm text-on-surface-variant">Grade 10 • Science Stream • ID: KJ-2024-089</p>
</div>
</div>
<!-- Intervention Form -->
<form class="space-y-lg" id="interventionForm">
<!-- Type of Intervention -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant block ml-1">Intervention Type</label>
<div class="grid grid-cols-2 gap-sm">
<button class="type-btn flex items-center gap-2 p-md rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-primary transition-all group" data-type="Support" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">volunteer_activism</span>
<span class="font-label-lg">Support</span>
</button>
<button class="type-btn flex items-center gap-2 p-md rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-primary transition-all group" data-type="Parent Meeting" type="button">
<span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">groups</span>
<span class="font-label-lg">Parent Meeting</span>
</button>
<button class="type-btn flex items-center gap-2 p-md rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-primary transition-all group" data-type="Counseling" type="button">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform">psychology</span>
<span class="font-label-lg">Counseling</span>
</button>
<button class="type-btn flex items-center gap-2 p-md rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-primary transition-all group" data-type="Discipline" type="button">
<span class="material-symbols-outlined text-error group-hover:scale-110 transition-transform">gavel</span>
<span class="font-label-lg">Discipline</span>
</button>
</div>
<input id="intervention_type" name="type" required="" type="hidden"/>
</div>
<!-- Notes Section -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant block ml-1" for="notes">Intervention Notes</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-on-surface focus:ring-0 transition-all resize-none" id="notes" name="notes" placeholder="Describe the discussion points and actions taken..." rows="6"></textarea>
</div>
<!-- Follow-up Date -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant block ml-1" for="follow_up">Scheduled Follow-up</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl h-[56px] px-md text-on-surface focus:ring-0 appearance-none" id="follow_up" name="follow_up" type="date"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">calendar_today</span>
</div>
</div>
<!-- Files/Attachments (High-end pattern) -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant block ml-1">Related Attachments</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center bg-surface-container-low/50 hover:bg-surface-container-low transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-on-surface-variant text-3xl group-hover:text-primary transition-colors">cloud_upload</span>
<p class="font-body-sm text-on-surface-variant mt-xs">Tap to upload photos or PDFs</p>
</div>
</div>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant/30 px-container-padding py-md z-50 flex gap-md">
<button class="flex-1 h-[54px] rounded-xl border border-outline-variant font-label-lg text-on-surface-variant hover:bg-surface-container-low transition-colors" onclick="history.back()" type="button">
            Discard
        </button>
<button class="flex-[2] h-[54px] rounded-xl primary-gradient sky-glow text-white font-headline-sm shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2" onclick="handleSave()" type="button">
<span class="material-symbols-outlined">save</span>
            Save Record
        </button>
</div>
<!-- Success Modal -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-container-padding hidden" id="successModal">
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"></div>
<div class="bg-surface rounded-2xl shadow-2xl p-xl w-full max-w-sm relative z-10 flex flex-col items-center text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-white text-4xl">check_circle</span>
</div>
<h3 class="font-headline-md text-on-surface">Record Saved</h3>
<p class="font-body-md text-on-surface-variant mt-xs">The intervention for Amina Juma has been logged successfully.</p>
<button class="mt-lg w-full h-[54px] rounded-xl primary-gradient text-white font-label-lg" onclick="window.location.reload()">Done</button>
</div>
</div>
<script>
        // Form Logic
        const typeBtns = document.querySelectorAll('.type-btn');
        const typeInput = document.getElementById('intervention_type');

        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Clear active states
                typeBtns.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    b.classList.add('bg-surface-container-lowest', 'text-on-surface', 'border-outline-variant');
                });
                
                // Set active
                btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                btn.classList.remove('bg-surface-container-lowest', 'border-outline-variant');
                typeInput.value = btn.getAttribute('data-type');
            });
        });

        function handleSave() {
            if(!typeInput.value) {
                alert('Please select an intervention type');
                return;
            }
            
            const btn = event.currentTarget;
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Saving...';

            setTimeout(() => {
                document.getElementById('successModal').classList.remove('hidden');
            }, 1200);
        }
    </script>
</body></html>
