<!-- Row Item (Repeating pattern) -->
<script>
                    const students = [
                        { name: "Amani Juma", reg: "KJS-2024-001", grade: "A-", alert: false, img: "https://images.unsplash.com/photo-1531123897727-8f129e16fd3c?auto=format&fit=crop&w=100&q=80" },
                        { name: "Baraka Mwinyi", reg: "KJS-2024-012", grade: "B+", alert: true, img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=100&q=80" },
                        { name: "Chausiku K.", reg: "KJS-2024-045", grade: "B-", alert: false, img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=100&q=80" },
                        { name: "Doto Masanja", reg: "KJS-2024-089", grade: "C", alert: true, img: "https://images.unsplash.com/photo-1521119989659-a83eee488204?auto=format&fit=crop&w=100&q=80" },
                        { name: "Faraja Omari", reg: "KJS-2024-102", grade: "A", alert: false, img: "https://images.unsplash.com/photo-1519345182560-3f2917c472ef?auto=format&fit=crop&w=100&q=80" },
                        { name: "Gifty S.", reg: "KJS-2024-115", grade: "B", alert: false, img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" },
                    ];

                    const renderStudents = () => {
                        const container = document.getElementById('student-list');
                        // Rendering a slice to simulate the start of 38 students
                        students.forEach((s, i) => {
                            const item = document.createElement('div');
                            item.className = `flex items-center justify-between p-md min-h-[64px] hover:bg-surface-container-low transition-colors cursor-pointer group ${i !== students.length - 1 ? 'clean-inset-divider' : ''}`;
                            item.innerHTML = `
                                <div class="flex items-center gap-md">
                                    <div class="relative">
                                        <img src="${s.img}" class="w-12 h-12 rounded-full object-cover border border-outline-variant" data-alt="A focused student portrait with a clean, educational background. Professional studio lighting with a high-contrast modern aesthetic using blues and whites.">
                                        ${s.alert ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-error rounded-full border-2 border-white"></span>' : ''}
                                    </div>
                                    <div>
                                        <h3 class="font-label-lg text-on-surface group-hover:text-primary transition-colors">${s.name}</h3>
                                        <p class="font-body-sm text-outline text-[12px] uppercase tracking-wider">${s.reg}</p>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end">
                                    <span class="px-3 py-1 rounded-lg ${s.grade.startsWith('A') ? 'bg-primary-container text-on-primary-container' : 'bg-surface-container-high text-on-surface-variant'} font-headline-sm text-headline-sm">
                                        ${s.grade}
                                    </span>
                                    <span class="text-[10px] font-label-md text-outline mt-1">LAST MARK</span>
                                </div>
                            `;
                            container.appendChild(item);
                        });
                    };
                    window.onload = renderStudents;
                </script>

<script>
        // Simple micro-interaction for active state scaling
        document.querySelectorAll('nav div').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.9)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Hide navigation when scrolling down to maximize content space on mobile
        let lastScrollTop = 0;
        const footer = document.querySelector('footer');
        const bottomNav = document.querySelector('nav');
        
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // Scroll Down
                footer.style.transform = 'translateY(100%)';
                bottomNav.style.transform = 'translateY(100%)';
            } else {
                // Scroll Up
                footer.style.transform = 'translateY(0)';
                bottomNav.style.transform = 'translateY(0)';
            }
            footer.style.transition = 'transform 0.3s ease';
            bottomNav.style.transition = 'transform 0.3s ease';
            lastScrollTop = scrollTop;
        });
    </script>
