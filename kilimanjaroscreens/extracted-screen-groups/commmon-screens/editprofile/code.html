<!DOCTYPE html>

                        "tertiary-fixed": "#e1e0ff",
                        "surface": "#faf8ff",

<style>
        .shadow1 { box-shadow: 0 2px 4px rgba(14, 165, 233, 0.05); }
        .shadow3 { box-shadow: 0 10px 15px rgba(14, 165, 233, 0.12); }
        .shadow5 { box-shadow: 0 20px 25px rgba(14, 165, 233, 0.18); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .primary-gradient {
            background: linear-gradient(135deg, #0ea5e9 0%, #006591 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 h-16 z-50 bg-background flex items-center justify-between px-container-padding shadow1">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high transition-colors duration-200 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile font-bold text-on-surface">Edit Profile</h1>
</div>
<button class="text-primary font-label-lg text-label-lg-mobile px-4 py-2 hover:bg-surface-container-high rounded-lg transition-colors active:scale-95">
            Save
        </button>
</header>
<main class="pt-24 pb-32 px-container-padding max-w-md mx-auto">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center mb-xl">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container shadow3">
<img alt="Alex Mountain" class="w-full h-full object-cover" data-alt="A professional portrait of a young male student named Alex Mountain, set against a blurred academic campus background in Tanzania. The lighting is warm and natural, suggesting a bright morning. He has a friendly and confident expression, wearing a crisp white school shirt. The overall aesthetic is clean, high-contrast, and modern, fitting the Kilimanjaro Schools brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-cOPugDAdnM3GuLg7uU6UqxxtdU7rT0Etz_P1BATfJ9eApSrrPFWibyPxowtTsiY7-v28T8ufQph7lKOAj5FiXokwEH8qDTvenRQqRoII9ysOUXtlIAR61qtVi6qKtnCGykGBaut3dOyqwt-KxDYzffh5hhL3pc0MY5iQOPEl0EIe66EPQNLEDQsmhjnAhfnUc0CChD3XNagrNgNt7wbrtqSlBGVQvicrTS5ocD_3JTptujoY5MzSus-eUARgQ7Zai53HAkvt0A"/>
</div>
<button class="absolute bottom-0 right-0 w-10 h-10 primary-gradient text-white rounded-full flex items-center justify-center border-4 border-background shadow3 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<div class="mt-md text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Alex Mountain</h2>
<p class="font-body-sm text-body-sm text-outline">Student ID: KS-2024-8832</p>
</div>
</section>
<!-- Form Fields -->
<form class="space-y-lg">
<!-- Section Title -->
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Personal Information</h3>
<div class="space-y-md">
<!-- Editable: First Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">First Name</label>
<input class="h-[56px] px-md rounded-[14px] bg-surface-container-lowest border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-on-surface" type="text" value="Alex"/>
</div>
<!-- Editable: Middle Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Middle Name</label>
<input class="h-[56px] px-md rounded-[14px] bg-surface-container-lowest border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-on-surface" type="text" value="J."/>
</div>
<!-- Editable: Last Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Last Name</label>
<input class="h-[56px] px-md rounded-[14px] bg-surface-container-lowest border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-on-surface" type="text" value="Mountain"/>
</div>
<!-- Editable: Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Phone Number</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-outline">+255</span>
<input class="w-full h-[56px] pl-[64px] pr-md rounded-[14px] bg-surface-container-lowest border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-on-surface" type="tel" value="712 345 678"/>
</div>
</div>
</div>
<hr class="border-outline-variant my-xl"/>
<!-- Read-Only Section -->
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Account Details</h3>
<div class="space-y-md">
<!-- Read Only: Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">School Email</label>
<div class="h-[56px] px-md rounded-[14px] bg-surface-container border border-outline-variant flex items-center justify-between opacity-80">
<span class="font-body-md text-on-surface-variant">alex.mountain@kilimanjaro.edu</span>
<span class="material-symbols-outlined text-[20px] text-outline" data-icon="lock">lock</span>
</div>
</div>
<!-- Read Only: Role -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Current Role</label>
<div class="h-[56px] px-md rounded-[14px] bg-surface-container border border-outline-variant flex items-center justify-between opacity-80">
<span class="font-body-md text-on-surface-variant">Grade 11 Student</span>
<span class="material-symbols-outlined text-[20px] text-outline" data-icon="lock">lock</span>
</div>
</div>
<!-- Read Only: Registration Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Registration Number</label>
<div class="h-[56px] px-md rounded-[14px] bg-surface-container border border-outline-variant flex items-center justify-between opacity-80">
<span class="font-body-md text-on-surface-variant">KS-2024-8832</span>
<span class="material-symbols-outlined text-[20px] text-outline" data-icon="lock">lock</span>
</div>
</div>
</div>
<!-- Danger Zone Action -->
<div class="pt-lg">
<button class="w-full text-error font-label-lg py-md border border-error-container rounded-[14px] hover:bg-error-container transition-colors active:scale-95" type="button">
                    Deactivate Student Profile
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface-container-lowest border-t border-outline-variant px-lg shadow5">
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined" data-icon="school">school</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full w-12 h-12 shadow3 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</nav>
</body></html>
