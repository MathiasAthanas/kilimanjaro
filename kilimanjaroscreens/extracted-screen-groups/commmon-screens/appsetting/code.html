</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">

<div class="bg-surface-container-lowest shadow1 border border-outline-variant/30 rounded-2xl p-md space-y-lg">

<span class="material-symbols-outlined text-[18px]" data-icon="light_mode">light_mode</span>
                            Light
                        </button>
<button class="flex-1 py-xs px-sm rounded-lg font-label-md text-label-md flex items-center justify-center gap-xs text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="settings_brightness">settings_brightness</span>
                            System
                        </button>
<button class="flex-1 py-xs px-sm rounded-lg font-label-md text-label-md flex items-center justify-center gap-xs text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="dark_mode">dark_mode</span>

</div>
</div>

</div>
</div>

</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>

<div class="bg-surface-container-lowest shadow1 border border-outline-variant/30 rounded-2xl overflow-hidden">
